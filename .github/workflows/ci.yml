name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request: {}
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-manifest:
    name: Check Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pipx run check-manifest

  cascade-smoke:
    name: CASCADE wheel and pretrained oracle py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    env:
      PYTEST_RUNNING: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CALI_CASCADE_MODELS: ${{ github.workspace }}/.cascade-models
    steps:
      - uses: actions/checkout@v6
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Build cali wheel
        run: uv build --wheel
      - name: Install base wheel without optional inference dependencies
        run: |
          uv venv .cascade-smoke
          for cali_wheel in dist/cali-*.whl; do
            uv pip install --python .cascade-smoke/bin/python "${cali_wheel}" pytest pytest-qt
          done
      - name: Verify installed base wheel with Torch and CASCADE absent
        env:
          CALI_CASCADE_BASE_TESTS: '1'
        run: .cascade-smoke/bin/python -I -Werror -m pytest --noconftest -q tests/test_cascade_base_install.py tests/test_cascade_package_loader.py
      - name: Install optional CASCADE dependency into the isolated wheel environment
        run: |
          uv pip install --python .cascade-smoke/bin/python torch --index https://download.pytorch.org/whl/cpu
          for cali_wheel in dist/cali-*.whl; do
            uv pip install --python .cascade-smoke/bin/python "${cali_wheel}[cascade]" pytest pytest-qt
          done
      - name: Test installed package, source pin, and upstream prediction
        run: .cascade-smoke/bin/python -I -m pytest --noconftest -q tests/test_cascade_package.py tests/test_spike_inference.py
      - name: Cache exact pretrained model
        uses: actions/cache@v5
        with:
          path: .cascade-models
          key: cascade-model-ac8954174ba0a01a2d929a7e8b3fc7e3a4365d5c01f5e262d2b597822fcae184
      - name: Download or verify pinned pretrained model
        run: .cascade-smoke/bin/python -I -m cali cascade-download Global_EXC_30Hz_smoothing25ms --expected-manifest ac8954174ba0a01a2d929a7e8b3fc7e3a4365d5c01f5e262d2b597822fcae184
      - name: Compare reference, cached chunks, and service with pretrained oracle
        env:
          CALI_CASCADE_REFERENCE_TESTS: '1'
        run: .cascade-smoke/bin/python -I -Werror -m pytest --noconftest -q tests/test_cascade_reference.py tests/test_cascade_cached.py -k 'pretrained or backend_import'
      - name: Verify installed-wheel extraction and offline analysis with pretrained models
        env:
          CALI_CASCADE_REFERENCE_TESTS: '1'
          PYTEST_RUNNING: '1'
          QT_QPA_PLATFORM: offscreen
        run: .cascade-smoke/bin/python -I -m pytest --noconftest -q tests/test_cascade_extraction.py tests/test_cascade_runner_analysis.py -k pretrained
      - name: Verify GUI run lifecycle and pretrained offline reanalysis
        env:
          CALI_CASCADE_REFERENCE_TESTS: '1'
          PYTEST_RUNNING: '1'
          QT_QPA_PLATFORM: offscreen
        run: .cascade-smoke/bin/python -I -m pytest --noconftest -q tests/test_cascade_gui_acceptance.py
      - name: Verify installed-wheel trace codec, migration, ROI/FOV, noise QC, export, and plot semantics
        env:
          QT_QPA_PLATFORM: offscreen
        run: .cascade-smoke/bin/python -I -m pytest --noconftest -q tests/test_trace_array_codec.py tests/test_noise_qc.py tests/test_cascade_real_plate_benchmark.py tests/test_cascade_device_benchmark.py tests/test_cascade_roi_analysis.py tests/test_cascade_fov_analysis.py tests/test_cascade_runner_analysis.py tests/test_spike_settings.py tests/test_spike_export.py tests/test_spike_plot_selection.py tests/test_spike_fov_plot_selection.py tests/test_spike_evoked_pca_selection.py tests/test_spike_comparison.py

  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }} ${{ matrix.backend }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
        platform: [macos-latest, windows-latest]
        resolution: [highest]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --no-dev --extra cp4 --group test --resolution ${{ matrix.resolution }}

      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1
          if (Test-Path -Path "C:\Windows\system32\opengl32.dll" -PathType Leaf) {Exit 0} else {Exit 1}

      - name: Run Tests
        run: uv run --no-sync coverage run -p -m pytest -v --color=yes

      - name: Combine & generate coverage XML
        run: |
          uv run --no-sync coverage combine
          uv run --no-sync coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.platform }}-py${{ matrix.python-version }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
